name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            archive: tar.gz
          - name: macos-arm64
            os: macos-14
            archive: tar.gz
          - name: windows-x86_64
            os: windows-2022
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build release binaries
        run: cargo build --release --locked -p layerrun-cli

      - name: Package Unix binaries
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist/package
          cp target/release/layerrun-cli dist/package/
          cp README.md dist/package/
          cp LICENSE* dist/package/ 2>/dev/null || true
          tar -czf "dist/layerrun-${{ matrix.name }}.tar.gz" -C dist/package .

      - name: Package Windows binaries
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item target/release/layerrun-cli.exe dist/package/
          Copy-Item README.md dist/package/
          Get-ChildItem LICENSE* -ErrorAction SilentlyContinue | Copy-Item -Destination dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath "dist/layerrun-${{ matrix.name }}.zip"

      - name: Upload packaged binaries
        uses: actions/upload-artifact@v4
        with:
          name: layerrun-${{ matrix.name }}
          path: dist/layerrun-${{ matrix.name }}.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release tag exists
        run: git rev-parse --verify "refs/tags/${RELEASE_TAG}"

      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum layerrun-* > SHA256SUMS

      - name: Create or update release
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --clobber
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --title "${RELEASE_TAG}" \
              --generate-notes \
              --verify-tag
          fi
