services:
  layerrun:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: layerrun:local
    container_name: layerrun
    ports:
      - "8080:8080"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - layerrun-cache:/root/.cache/layerrun
    restart: unless-stopped

volumes:
  layerrun-cache:
