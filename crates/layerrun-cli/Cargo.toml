[package]
name = "layerrun-cli"
version = "0.1.0"
edition = "2024"

[features]
default = []
mlx = ["layerrun-core/mlx", "layerrun-server/mlx"]

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
layerrun-core={path="../layerrun-core"}
layerrun-server = { path = "../layerrun-server" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
